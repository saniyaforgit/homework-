<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shop with API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

   
    <div class="header">
        <h1>Shop</h1>
        <button id="logoutBtn">Выйти</button>
    </div>

   
    <section id="loginScreen" class="screen">
        <h2>Вход</h2>

        <form id="loginForm">
            <input id="usernameInput" placeholder="Username"><br><br>
            <input id="passwordInput" type="password" placeholder="Password"><br><br>

            <button type="submit">Войти</button>
        </form>

        <p id="loginMessage"></p>
    </section>

    
    <section id="profileScreen" class="screen hidden">
        <h2>Профиль</h2>

        <div id="profileBlock"></div>

        <button id="goToProductsBtn">Перейти к товарам</button>
    </section>

   
    <section id="productsScreen" class="screen hidden">
        <h2>Товары</h2>

        <button id="backtoProfileBtn">Профиль</button>

        <div id="productsBlock"></div>
    </section>

   
    <section id="detailScreen" class="screen hidden">
        <h2>Товар</h2>

        <button id="backToProductsBtn">Назад к товарам</button>

        <div id="productDetailBlock"></div>
    </section>

</div>

<script src="app.js"></script>

</body>
</html>
