<!DOCTYPE html>
<html lang="ут">
<head>
    <meta charset="UTF-8">
    <title>Проверка комментария</title>
    <style>
        body { font-family: Arial; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>

<h2>Оставьте комментарий</h2>

<textarea id="comment" rows="4" cols="50" placeholder="Введите комментарий"></textarea><br><br>

<button id="submitBtn">Отправить</button>

<div id="error" class="error"></div>
<div id="result" class="success"></div>


<script src="script.js"></script>

</body>
</html>
